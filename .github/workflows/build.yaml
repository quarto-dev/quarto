
name: Build VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'apps/lsp/**'
      - 'apps/vscode/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/lsp/**'
      - 'apps/vscode/**'
  workflow_dispatch:

jobs:
  package-extension:
    runs-on: ubuntu-latest
    outputs:
      vsixPath: ${{ steps.package_extension.outputs.vsixPath }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
      - run: yarn install --immutable --immutable-cache --check-cache

      - name: Package extension
        uses: HaaLeo/publish-vscode-extension@v2
        id: package_extension
        with:
          pat: not-a-real-pat
          yarn: true
          dryRun: true
          preRelease: true
          packagePath: apps/vscode

      - name: Upload extension vsix file as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarto-vscode-${{ github.sha }}
          path: ${{ steps.package_extension.outputs.vsixPath }}
