name: Test VS Code Extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-packages:
    runs-on: ubuntu-latest
    name: Test packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
      - run: yarn install --immutable --immutable-cache --check-cache
      - name: Run package tests
        run: yarn test-packages

  test-extension:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: [release, pre-release]
    name: Test (Quarto ${{ matrix.quarto }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
      - name: Update build environment and install XVFB
        run: |
          sudo apt-get -y update
          sudo apt-get -y install --fix-missing xvfb
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.quarto }}
      - name: Build vscode extension
        run: |
          yarn install
          yarn run build-vscode
      - name: Compile and run tests
        env:
          QUARTO_CHANNEL: ${{ matrix.quarto }}
        run: |
          yarn install --immutable --immutable-cache --check-cache
          xvfb-run yarn test-vscode
